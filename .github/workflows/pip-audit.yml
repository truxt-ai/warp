name: Python Security Audit

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  pip-audit:
    name: pip-audit Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit
        run: pip-audit -r tools/requirements.txt

  pip-outdated:
    name: Python Outdated Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r tools/requirements.txt
      - name: Fail on outdated packages
        run: |
          pip list --outdated --format=json > outdated.json
          COUNT=$(python3 -c "import json; print(len(json.load(open('outdated.json'))))")
          echo "Found $COUNT outdated packages"
          if [ "$COUNT" -gt "0" ]; then
            python3 -c "
              import json
              for p in json.load(open('outdated.json')):
                print(p['name'] + ': ' + p['version'] + ' → ' + p['latest_version'])
            "
            exit 1
          fi
